<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="384" viewBox="0 0 1200 384" role="img" aria-labelledby="title desc">
  <title id="title">Moein Najafi, Chief Technology Officer</title>
  <desc id="desc">Fintech, LendTech, and BNPL. An abstract network connects a document, a transaction, and a payment card.</desc>
  <defs>
    <linearGradient id="background" x2="1200" y2="384" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101a21"/>
      <stop offset=".56" stop-color="#102325"/>
      <stop offset="1" stop-color="#102d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" x2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80e4b0"/>
      <stop offset="1" stop-color="#eacb94" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
