      <text x="356" y="57" fill="#a0b8c6" font-size="14" letter-spacing="2" text-anchor="end">03 / TRANSACTIONS</text>
      <text x="27" y="132" fill="#f2f5ef" font-size="31" font-weight="600">Banking &amp; Payments</text>
