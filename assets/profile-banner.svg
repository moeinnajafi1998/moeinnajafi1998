    </pattern>
    <linearGradient id="grid-mask" x1="640" x2="1170" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="fade">
      <rect x="640" y="26" width="530" height="332" fill="url(#grid-mask)"/>
