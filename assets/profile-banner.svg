  </defs>

  <rect x="1" y="1" width="1198" height="382" rx="27" fill="url(#background)" stroke="#345151" stroke-width="2"/>
  <rect x="640" y="26" width="530" height="332" fill="url(#grid)" mask="url(#fade)"/>

